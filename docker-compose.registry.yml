# Onedo bot — اجرا با ایمیج‌های منتشرشده روی Gitea Container Registry
# نیازی به کلون سورس یا بیلد محلی نیست.
#
# استفاده:
#   cp .env.example .env   # مقادیر را ویرایش کنید
#   docker compose -f docker-compose.registry.yml up -d
#
# تگ ایمیج (اختیاری):
#   ONEDO_IMAGE_TAG=latest docker compose -f docker-compose.registry.yml up -d
#
# رجیستری خصوصی: قبل از pull لاگین کنید
#   docker login gitea.tmayt.ir

services:
  nginx:
    image: gitea.tmayt.ir/thaiostream/onedo-bot-nginx:${ONEDO_IMAGE_TAG:-latest}
    container_name: onedo-bot-nginx
    ports:
      - "${ONEDO_PORT:-12277}:80"
    depends_on:
      - frontend
      - backend
    networks:
      - onedo-net
    restart: unless-stopped

  frontend:
    image: gitea.tmayt.ir/thaiostream/onedo-bot-frontend:${ONEDO_IMAGE_TAG:-latest}
    container_name: onedo-bot-frontend
    networks:
      - onedo-net
    restart: unless-stopped

  backend:
    image: gitea.tmayt.ir/thaiostream/onedo-bot-backend:${ONEDO_IMAGE_TAG:-latest}
    container_name: onedo-bot-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-onedo}:${POSTGRES_PASSWORD:-onedo_secret}@db:5432/${POSTGRES_DB:-onedo_bot}
      BROWSER_WS_URL: ws://browser:3000
      BROWSER_HTTP_URL: http://browser:3000
    depends_on:
      db:
        condition: service_healthy
      browser:
        condition: service_started
    networks:
      - onedo-net
    volumes:
      - browser_data:/data/browser
    restart: unless-stopped

  browser:
    image: gitea.tmayt.ir/thaiostream/onedo-bot-browser:${ONEDO_IMAGE_TAG:-latest}
    container_name: onedo-bot-browser
    environment:
      DISPLAY_WIDTH: "1280"
      DISPLAY_HEIGHT: "800"
    networks:
      - onedo-net
    volumes:
      - browser_data:/data/browser
    shm_size: "1gb"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: onedo-bot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onedo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onedo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-onedo_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - onedo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  onedo-net:
    driver: bridge

volumes:
  pgdata:
  browser_data:
